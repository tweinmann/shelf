{{- /*
A preview has no `shelf app add` that generates its secrets, so in preview mode the chart does:
every generated secret keeps the value already in shelf-secrets, or gets a new random one. The
values stay in the preview namespace, and go away with it. An app's shelf-secrets is copied by
the platform from shelf-system/app-<app> instead; the chart never renders it then.
*/}}
{{- if .Values.platform.preview }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "shelf-secrets" }}
{{- $old := dict }}
{{- if $existing }}{{ $old = $existing.data | default dict }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: shelf-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    shelf.dev/app: {{ .Values.name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  {{- range $name, $secret := .Values.secrets | default dict }}
  {{- if and $secret $secret.generate }}
  {{ $name }}: {{ index $old $name | default (randAlphaNum 26 | b64enc) }}
  {{- end }}
  {{- end }}
{{- end }}
