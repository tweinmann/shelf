# Reusable workflow for shelf tenants. It builds the images an app.yaml declares with `build`,
# renders the app.yaml and pushes the deploy artifact ghcr.io/<owner>/<package>, which shelf
# deploys.
#
# A tenant repository only needs an app.yaml and this workflow:
#
#   on:
#     push:
#       branches: ['**']
#     pull_request:
#     delete:
#   permissions:
#     contents: read
#     packages: write
#     id-token: write
#   jobs:
#     shelf:
#       uses: tweinmann/shelf/.github/workflows/build.yml@v0
#
# Everything the workflow publishes lives under the package name, which is app.yaml's `name`:
# the deploy artifact is ghcr.io/<owner>/<package>, and every component with `build: ./web` is
# pushed as ghcr.io/<owner>/<package>/<component>. Images are pinned to the digest the build
# reported. A push to the default branch publishes everything as sha-<short> and main; a push to
# another branch as sha-<short> and branch-<slug> (`shelf build-plan --branch`), which an app with
# previews runs as <app>--<slug>; never as main. Deleting the branch deletes its deploy
# artifact, and the preview goes with it. Pull requests build the images but push nothing, so a
# change is checked without deploying it, and a fork can never publish.
#
# Image layers are cached in the registry as <image>:buildcache: every run reads the cache, and
# every run that publishes writes it back.
#
# A run that publishes signs every built image and the deploy artifact with keyless cosign (the
# job's GitHub OIDC token, hence `id-token: write`; the identity is this workflow, and the
# signature is recorded in the public Rekor log, repository name and commit included). It scans
# every image the rendered app.yaml names with Trivy, attaches the report to each built image as
# a `vuln` attestation, and writes the counts of CRITICAL and HIGH findings per image digest into
# the deploy artifact as the annotation dev.shelf.scan, which the artifact's signature covers.
# Findings never fail the build. The channel tag (main or branch-<slug>) moves only to a signed
# artifact. Signatures use cosign's classic format, which the Sigstore policy-controller reads.
#
# A caller that keeps `branches: [main]` and no `delete` keeps working; it gets no previews.
#
# The package is not the app: shelf names an app when it is added (shelf app add <app> <artifact>),
# so the same artifact can run as several apps.
name: shelf build

on:
  workflow_call:
    inputs:
      app-file:
        description: Path of app.yaml.
        type: string
        default: app.yaml
      shelf-version:
        description: >-
          shelf release to use, e.g. v0.1.0. Defaults to the latest release. Publishing a branch
          needs a release with `shelf build-plan --branch`.
        type: string
        default: latest
      platforms:
        description: >-
          Platforms to build the images for, comma-separated. linux/arm64 matches the hosts shelf
          runs on; add linux/amd64 for a cloud target. Platforms other than the runner's are
          built through QEMU, which is several times slower.
        type: string
        default: linux/arm64
    outputs:
      artifact:
        description: The deploy artifact, oci://ghcr.io/<owner>/<package>:<main or branch-slug>; empty unless published.
        value: ${{ jobs.build.outputs.artifact }}

jobs:
  build:
    if: github.event_name != 'delete'
    # The same architecture as the Mac mini, so images build natively.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      artifact: ${{ steps.publish.outputs.artifact }}
    env:
      APP_FILE: ${{ inputs.app-file }}
      PLATFORMS: ${{ inputs.platforms }}
      COSIGN_VERSION: v3.1.3
      TRIVY_VERSION: 0.75.0
      PUBLISH: ${{ github.event_name == 'push' }}
      DEFAULT_BRANCH: ${{ github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7

      - name: Install shelf
        env:
          SHELF_VERSION: ${{ inputs.shelf-version }}
        run: |
          releases=https://github.com/tweinmann/shelf/releases
          if [[ "$SHELF_VERSION" == latest ]]; then
            url="$releases/latest/download"
          else
            url="$releases/download/$SHELF_VERSION"
          fi
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/shelf.tar.gz" "$url/shelf_linux_arm64.tar.gz"
          curl -fsSL -o "$tmp/checksums.txt" "$url/checksums.txt"
          (cd "$tmp" && mv shelf.tar.gz shelf_linux_arm64.tar.gz \
            && grep ' ./shelf_linux_arm64.tar.gz$' checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/shelf_linux_arm64.tar.gz" -C "$tmp" shelf
          sudo install "$tmp/shelf" /usr/local/bin/shelf
          shelf version

      - name: Validate app.yaml
        run: shelf validate "$APP_FILE"

      - name: Install cosign and Trivy
        if: env.PUBLISH == 'true'
        run: |
          tmp="$(mktemp -d)"
          cosign=https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION
          curl -fsSL -o "$tmp/cosign-linux-arm64" "$cosign/cosign-linux-arm64"
          curl -fsSL -o "$tmp/cosign_checksums.txt" "$cosign/cosign_checksums.txt"
          (cd "$tmp" && grep ' cosign-linux-arm64$' cosign_checksums.txt | sha256sum -c -)
          sudo install "$tmp/cosign-linux-arm64" /usr/local/bin/cosign
          trivy=https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION
          curl -fsSL -o "$tmp/trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz" "$trivy/trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"
          curl -fsSL -o "$tmp/trivy_checksums.txt" "$trivy/trivy_${TRIVY_VERSION}_checksums.txt"
          (cd "$tmp" && grep " trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz\$" trivy_checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz" -C "$tmp" trivy
          sudo install "$tmp/trivy" /usr/local/bin/trivy
          cosign version
          trivy --version
          echo "TRIVY_DAY=$(date -u +%Y-%m-%d)" >>"$GITHUB_ENV"

      # Trivy's vulnerability database is downloaded once a day and shared between runs.
      - uses: actions/cache@v4
        if: env.PUBLISH == 'true'
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ env.TRIVY_DAY }}
          restore-keys: trivy-db-

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-qemu-action@v4
        if: inputs.platforms != 'linux/arm64'

      - uses: docker/setup-buildx-action@v4

      - name: Build the images of this repository
        id: images
        run: |
          if [[ "$DEFAULT_BRANCH" == true || "$PUBLISH" != true ]]; then
            plan="$(shelf build-plan "$APP_FILE")"
            channel=main
          else
            plan="$(shelf build-plan "$APP_FILE" --branch "$GITHUB_REF_NAME")"
            channel="$(jq -r .tag <<<"$plan")"
          fi
          package="$(jq -r .package <<<"$plan")"
          echo "package=$package" >>"$GITHUB_ENV"
          echo "channel=$channel" >>"$GITHUB_ENV"
          images=()
          while read -r component context; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$package/$component"
            args=(--platform "$PLATFORMS"
              --tag "$image:sha-${GITHUB_SHA::7}" --tag "$image:$channel"
              --cache-from "type=registry,ref=$image:buildcache"
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
              --label "org.opencontainers.image.revision=$GITHUB_SHA"
              --metadata-file "$RUNNER_TEMP/$component.json")
            if [[ "$PUBLISH" == true ]]; then
              args+=(--push
                --cache-to "type=registry,ref=$image:buildcache,mode=max,image-manifest=true,oci-mediatypes=true")
            fi
            echo "::group::$image from $context"
            docker buildx build "${args[@]}" "$context"
            echo "::endgroup::"
            if [[ "$PUBLISH" == true ]]; then
              digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/$component.json")"
              # With the commit tag in front of the digest, the rendered app.yaml shows which
              # commit built the image; shelf pins it to the digest either way.
              images+=("--image" "$component=$image:sha-${GITHUB_SHA::7}@$digest")
              echo "$digest" >>"$RUNNER_TEMP/built"
              cosign sign --yes --use-signing-config=false --new-bundle-format=false "$image@$digest"
            fi
          done < <(jq -r '.builds[] | "\(.component) \(.context)"' <<<"$plan")
          : >"$RUNNER_TEMP/image-args"
          touch "$RUNNER_TEMP/built"
          if (( ${#images[@]} )); then
            printf '%s\n' "${images[@]}" >"$RUNNER_TEMP/image-args"
          fi

      - uses: fluxcd/flux2/action@v2.9.5
        if: env.PUBLISH == 'true'
        with:
          version: 2.9.5

      - name: Render and push the deploy artifact
        id: publish
        if: env.PUBLISH == 'true'
        run: |
          mapfile -t image_args <"$RUNNER_TEMP/image-args"
          mkdir -p "$RUNNER_TEMP/deploy"
          shelf render "$APP_FILE" "${image_args[@]}" >"$RUNNER_TEMP/deploy/configmap.yaml"

          # Scan every image the rendered app.yaml pins, built and third-party. shelf renders
          # each one as <reference>@sha256:<digest>.
          scanned_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          scan='{}'
          while read -r ref; do
            echo "::group::scan $ref"
            trivy image --quiet --scanners vuln --platform "${PLATFORMS%%,*}" --format json \
              --output "$RUNNER_TEMP/report.json" "$ref"
            echo "::endgroup::"
            counts="$(jq -c '[.Results[]?.Vulnerabilities[]?.Severity]
              | {critical: map(select(. == "CRITICAL")) | length, high: map(select(. == "HIGH")) | length}' \
              "$RUNNER_TEMP/report.json")"
            scan="$(jq -c --arg d "${ref##*@}" --argjson c "$counts" '. + {($d): $c}' <<<"$scan")"
            if grep -qxF "${ref##*@}" "$RUNNER_TEMP/built"; then
              trivy convert --quiet --format cosign-vuln --output "$RUNNER_TEMP/vuln.json" "$RUNNER_TEMP/report.json"
              cosign attest --yes --use-signing-config=false --new-bundle-format=false \
                --type vuln --predicate "$RUNNER_TEMP/vuln.json" "$ref"
            fi
          done < <(grep -oE '[^[:space:]]+@sha256:[0-9a-f]{64}' "$RUNNER_TEMP/deploy/configmap.yaml" | sort -u)
          summary="$(jq -c --arg s "trivy $TRIVY_VERSION" --arg t "$scanned_at" \
            '{scanner: $s, scannedAt: $t, images: .}' <<<"$scan")"

          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$package"
          flux push artifact "oci://$repo:sha-${GITHUB_SHA::7}" \
            --path "$RUNNER_TEMP/deploy" \
            --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --revision "$GITHUB_REF_NAME@sha1:$GITHUB_SHA" \
            --annotations "dev.shelf.package=$package" \
            --annotations "dev.shelf.scan=$summary" \
            --output json >"$RUNNER_TEMP/pushed.json"
          # The channel tag moves only to a signed artifact.
          cosign sign --yes --use-signing-config=false --new-bundle-format=false \
            "$repo@$(jq -r .digest "$RUNNER_TEMP/pushed.json")"
          flux tag artifact "oci://$repo:sha-${GITHUB_SHA::7}" --tag "$channel"
          echo "artifact=oci://$repo:$channel" >>"$GITHUB_OUTPUT"
          {
            echo "### Deploy artifact"
            echo
            echo "\`oci://$repo:$channel\` (also \`sha-${GITHUB_SHA::7}\`)"
            echo
            if [[ "$channel" == main ]]; then
              echo "Add it as an app once, under a name of your choice:"
              echo
              echo "\`\`\`"
              echo "shelf app add $package oci://$repo:main"
              echo "\`\`\`"
            else
              echo "An app with previews (\`shelf app credentials <app> --previews\`) runs it as a preview:"
              echo
              echo "\`\`\`"
              echo "shelf app status <app> --preview $GITHUB_REF_NAME --wait --commit $GITHUB_SHA"
              echo "shelf app open <app> --preview $GITHUB_REF_NAME"
              echo "\`\`\`"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

  # A deleted branch takes its deploy artifact with it, and with it its preview: the platform
  # follows the tags of the registry. GHCR deletes a tag only as the package version that carries
  # it, through the GitHub API; the cluster never calls that API.
  delete-branch:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      APP_FILE: ${{ inputs.app-file }}
      BRANCH: ${{ github.event.ref }}
      OWNER_TYPE: ${{ github.event.repository.owner.type }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The default branch's app.yaml names the package.
      - uses: actions/checkout@v7

      - name: Install shelf
        env:
          SHELF_VERSION: ${{ inputs.shelf-version }}
        run: |
          releases=https://github.com/tweinmann/shelf/releases
          if [[ "$SHELF_VERSION" == latest ]]; then
            url="$releases/latest/download"
          else
            url="$releases/download/$SHELF_VERSION"
          fi
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/shelf.tar.gz" "$url/shelf_linux_arm64.tar.gz"
          curl -fsSL -o "$tmp/checksums.txt" "$url/checksums.txt"
          (cd "$tmp" && mv shelf.tar.gz shelf_linux_arm64.tar.gz \
            && grep ' ./shelf_linux_arm64.tar.gz$' checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/shelf_linux_arm64.tar.gz" -C "$tmp" shelf
          sudo install "$tmp/shelf" /usr/local/bin/shelf

      - name: Delete the branch's deploy artifact
        run: |
          plan="$(shelf build-plan "$APP_FILE" --branch "$BRANCH")"
          package="$(jq -r .package <<<"$plan")"
          tag="$(jq -r .tag <<<"$plan")"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "$OWNER_TYPE" == Organization ]]; then
            base="/orgs/$owner/packages/container/$package/versions"
          else
            base="/users/$owner/packages/container/$package/versions"
          fi
          ids="$(gh api --paginate "$base" \
            --jq ".[] | select(.metadata.container.tags | index(\"$tag\")) | .id")"
          if [[ -z "$ids" ]]; then
            echo "ghcr.io/$owner/$package has no version tagged $tag; nothing to delete"
            exit 0
          fi
          for id in $ids; do
            gh api --method DELETE "$base/$id"
            echo "deleted ghcr.io/$owner/$package:$tag (version $id)"
          done
          echo "Deleted \`ghcr.io/$owner/$package:$tag\`; its preview goes within a minute." >>"$GITHUB_STEP_SUMMARY"
