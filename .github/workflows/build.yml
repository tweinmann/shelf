# Reusable workflow for shelf tenants. It builds the images an app.yaml declares with `build`,
# renders the app.yaml and pushes the deploy artifact ghcr.io/<owner>/<app>-deploy, which shelf
# deploys.
#
# A tenant repository only needs an app.yaml and this workflow:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#   permissions:
#     contents: read
#     packages: write
#   jobs:
#     shelf:
#       uses: tweinmann/shelf/.github/workflows/build.yml@v0
#
# Every component with `build: ./web` is pushed as ghcr.io/<owner>/<repository>-<component> with
# the tags sha-<short> and main, and pinned to the digest it got. On the default branch the
# deploy artifact is pushed as well, with the tags sha-<short> and main. On other branches and in
# pull requests the images are built but nothing is pushed, so a change is checked without
# deploying it.
name: shelf build

on:
  workflow_call:
    inputs:
      app-file:
        description: Path of app.yaml.
        type: string
        default: app.yaml
      shelf-version:
        description: shelf release to use, e.g. v0.1.0. Defaults to the latest release.
        type: string
        default: latest
    outputs:
      artifact:
        description: The deploy artifact, oci://ghcr.io/<owner>/<app>-deploy:main; empty unless published.
        value: ${{ jobs.build.outputs.artifact }}

jobs:
  build:
    # The same architecture as the Mac mini, so images build natively.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      artifact: ${{ steps.publish.outputs.artifact }}
    env:
      APP_FILE: ${{ inputs.app-file }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7

      - name: Install shelf
        env:
          SHELF_VERSION: ${{ inputs.shelf-version }}
        run: |
          releases=https://github.com/tweinmann/shelf/releases
          if [[ "$SHELF_VERSION" == latest ]]; then
            url="$releases/latest/download"
          else
            url="$releases/download/$SHELF_VERSION"
          fi
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/shelf.tar.gz" "$url/shelf_linux_arm64.tar.gz"
          curl -fsSL -o "$tmp/checksums.txt" "$url/checksums.txt"
          (cd "$tmp" && mv shelf.tar.gz shelf_linux_arm64.tar.gz \
            && grep ' ./shelf_linux_arm64.tar.gz$' checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/shelf_linux_arm64.tar.gz" -C "$tmp" shelf
          sudo install "$tmp/shelf" /usr/local/bin/shelf
          shelf version

      - name: Validate app.yaml
        run: shelf validate "$APP_FILE"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v4

      - name: Build the images of this repository
        id: images
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          images=()
          while read -r component context; do
            image="ghcr.io/$owner/${repository,,}-$component"
            args=(--platform linux/arm64
              --tag "$image:sha-${GITHUB_SHA::7}" --tag "$image:main"
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
              --label "org.opencontainers.image.revision=$GITHUB_SHA"
              --metadata-file "$RUNNER_TEMP/$component.json")
            if [[ "$PUBLISH" == true ]]; then
              args+=(--push)
            fi
            echo "::group::$image from $context"
            docker buildx build "${args[@]}" "$context"
            echo "::endgroup::"
            if [[ "$PUBLISH" == true ]]; then
              digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/$component.json")"
              images+=("--image" "$component=$image@$digest")
            fi
          done < <(shelf build-plan "$APP_FILE" | jq -r '.[] | "\(.component) \(.context)"')
          : >"$RUNNER_TEMP/image-args"
          if (( ${#images[@]} )); then
            printf '%s\n' "${images[@]}" >"$RUNNER_TEMP/image-args"
          fi

      - uses: fluxcd/flux2/action@v2.9.5
        if: env.PUBLISH == 'true'
        with:
          version: 2.9.5

      - name: Render and push the deploy artifact
        id: publish
        if: env.PUBLISH == 'true'
        run: |
          mapfile -t image_args <"$RUNNER_TEMP/image-args"
          mkdir -p "$RUNNER_TEMP/deploy"
          shelf render "$APP_FILE" "${image_args[@]}" >"$RUNNER_TEMP/deploy/configmap.yaml"
          app="$(sed -n 's/^  name: \(.*\)-values$/\1/p' "$RUNNER_TEMP/deploy/configmap.yaml")"
          [[ -n "$app" ]] || { echo "could not read the app name" >&2; exit 1; }
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$app-deploy"
          flux push artifact "oci://$repo:sha-${GITHUB_SHA::7}" \
            --path "$RUNNER_TEMP/deploy" \
            --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --revision "$GITHUB_REF_NAME@sha1:$GITHUB_SHA" \
            --annotations "dev.shelf.app=$app"
          flux tag artifact "oci://$repo:sha-${GITHUB_SHA::7}" --tag main
          echo "artifact=oci://$repo:main" >>"$GITHUB_OUTPUT"
          {
            echo "### Deploy artifact"
            echo
            echo "\`oci://$repo:main\` (also \`sha-${GITHUB_SHA::7}\`)"
            echo
            echo "Add the app once with:"
            echo
            echo "\`\`\`"
            echo "shelf app add $app oci://$repo:main"
            echo "\`\`\`"
          } >>"$GITHUB_STEP_SUMMARY"
