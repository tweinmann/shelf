# An app with previews has a second ResourceSetInputProvider in shelf-system, <app>--previews,
# labelled shelf.dev/previews, written by `shelf app add --previews`. It is of type OCIArtifactTag
# on the app's deploy artifact and exports one input set per tag branch-<slug>: id, tag and digest,
# plus the defaults app, url, insecure and registry. For each one this ResourceSet generates a
# preview: the app's deploy chain at the branch tag, in a namespace of its own.
#
# A preview is never exposed: no tunnel, no cloudflared, no DNS record. It answers at
# <app>--<slug>.shelf.internal inside the cluster, and `shelf app open --preview` reaches it. Its
# secrets are generated by the chart (platform.preview), never copied from the app, and its
# volumes are its own. A tag that disappears from the registry takes the preview with it.
#
# A preview is verified like its app: its deploy artifact and the chart only with a valid
# signature of the cluster's signer, and its namespace is checked by the policy-controller
# against the app's ClusterImagePolicy, which the ResourceSet apps generates.
#
# The slug was made by shelf (`shelf build-plan --branch`), so the name only strips the prefix.
# It is spelled out wherever it is needed: Flux substitutes ${...} in the platform when it applies
# it, and a template variable starting with $ would not survive that.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: previews
  namespace: shelf-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 10m
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      selector:
        matchExpressions:
          - key: shelf.dev/previews
            operator: Exists
  resourcesTemplate: |
    ---
    apiVersion: v1
    kind: Namespace
    metadata:
      name: << inputs.app >>--<< trimPrefix "branch-" inputs.tag >>
      labels:
        shelf.dev/app: << inputs.app >>
        shelf.dev/preview: << trimPrefix "branch-" inputs.tag >>
        policy.sigstore.dev/include: "true"
    ---
    # The signer's key for verify, empty for a keyless signer.
    apiVersion: v1
    kind: Secret
    metadata:
      name: shelf-signer
      namespace: << inputs.app >>--<< trimPrefix "branch-" inputs.tag >>
      annotations:
        fluxcd.controlplane.io/copyFrom: shelf-system/signer-key
    type: Opaque
    ---
    # The login of the app's registry connection, for the preview's images and deploy artifact.
    apiVersion: v1
    kind: Secret
    metadata:
      name: shelf-registry
      namespace: << inputs.app >>--<< trimPrefix "branch-" inputs.tag >>
      annotations:
        fluxcd.controlplane.io/copyFrom: "shelf-system/<< if inputs.registry >>connection-registry-<< inputs.registry >><< else >>registry-anonymous<< end >>"
    type: kubernetes.io/dockerconfigjson
    ---
    # One preview cannot take the host from the app: requests are capped, and the LimitRange gives
    # containers without requests a default, which a quota on requests needs.
    apiVersion: v1
    kind: ResourceQuota
    metadata:
      name: shelf-preview
      namespace: << inputs.app >>--<< trimPrefix "branch-" inputs.tag >>
    spec:
      hard:
        requests.cpu: "1"
        requests.memory: 2Gi
        requests.storage: 5Gi
    ---
    apiVersion: v1
    kind: LimitRange
    metadata:
      name: shelf-preview
      namespace: << inputs.app >>--<< trimPrefix "branch-" inputs.tag >>
    spec:
      limits:
        - type: Container
          defaultRequest:
            cpu: 50m
            memory: 64Mi
          default:
            memory: 512Mi
    ---
    # As for an app: the deploy Kustomization may only manage ConfigMaps in the namespace.
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: shelf-deploy
      namespace: << inputs.app >>--<< trimPrefix "branch-" inputs.tag >>
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: shelf-deploy
      namespace: << inputs.app >>--<< trimPrefix "branch-" inputs.tag >>
    rules:
      - apiGroups: [""]
        resources: [configmaps]
        verbs: [get, list, watch, create, update, patch, delete]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: shelf-deploy
      namespace: << inputs.app >>--<< trimPrefix "branch-" inputs.tag >>
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: shelf-deploy
    subjects:
      - kind: ServiceAccount
        name: shelf-deploy
        namespace: << inputs.app >>--<< trimPrefix "branch-" inputs.tag >>
    ---
    # Every 30 seconds, not every minute as for an app: an agent waits for this.
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    metadata:
      name: deploy
      namespace: << inputs.app >>--<< trimPrefix "branch-" inputs.tag >>
    spec:
      interval: 30s
      url: << inputs.url >>
      ref:
        tag: << inputs.tag >>
      insecure: << inputs.insecure >>
      secretRef:
        name: shelf-registry
      verify: ${SHELF_SIGNER_VERIFY}
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: deploy
      namespace: << inputs.app >>--<< trimPrefix "branch-" inputs.tag >>
    spec:
      interval: 10m
      sourceRef:
        kind: OCIRepository
        name: deploy
      path: ./
      prune: true
      wait: true
      timeout: 2m
      targetNamespace: << inputs.app >>--<< trimPrefix "branch-" inputs.tag >>
      serviceAccountName: shelf-deploy
      commonMetadata:
        labels:
          shelf.dev/app: << inputs.app >>
          reconcile.fluxcd.io/watch: Enabled
    ---
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    metadata:
      name: shelf-app
      namespace: << inputs.app >>--<< trimPrefix "branch-" inputs.tag >>
    spec:
      interval: 1h
      url: ${SHELF_CHART_URL}
      ref:
        tag: ${SHELF_CHART_TAG}
      insecure: ${SHELF_INSECURE_REGISTRY:=false}
      verify: ${SHELF_SIGNER_VERIFY}
      layerSelector:
        mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
        operation: copy
    ---
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: << inputs.app >>--<< trimPrefix "branch-" inputs.tag >>
      namespace: << inputs.app >>--<< trimPrefix "branch-" inputs.tag >>
    spec:
      interval: 10m
      chartRef:
        kind: OCIRepository
        name: shelf-app
      valuesFrom:
        - kind: ConfigMap
          name: shelf-values
          valuesKey: app.yaml
      values:
        name: << inputs.app >>--<< trimPrefix "branch-" inputs.tag >>
        platform:
          domain: shelf.internal
          hostSuffix: ""
          imagePullSecret: shelf-registry
          preview: true
      install:
        remediation:
          retries: 3
      upgrade:
        remediation:
          retries: 3
          remediateLastFailure: true
