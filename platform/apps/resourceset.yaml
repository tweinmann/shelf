# Every app is a ResourceSetInputProvider in shelf-system, labelled shelf.dev/app, created by
# `shelf app add` with the inputs name, url, tag, insecure, domain, tunnel, registry and
# cloudflare. For each one this
# ResourceSet generates the app namespace and everything Flux needs to deploy the app from its
# deploy artifact, and, for an app with a tunnel, the cloudflared that carries it to the
# internet. Deleting the provider deletes all of it, including the namespace.
#
# What apps share is only what the user assigned to several of them: a registry connection, whose
# login is copied into each of their namespaces. Namespace, secrets, tunnel and cloudflared are
# every app's own.
#
# ${SHELF_...} is substituted by Flux from the ConfigMap flux-system/shelf-config, which
# `shelf init cluster` writes. << inputs.* >> is filled in by the Flux Operator per app.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: apps
  namespace: shelf-system
  annotations:
    # Copied Secrets are refreshed at this interval; a change to a Secret labelled
    # reconcile.fluxcd.io/watch is picked up at once.
    fluxcd.controlplane.io/reconcileEvery: 10m
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      selector:
        matchExpressions:
          - key: shelf.dev/app
            operator: Exists
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.name >>
        labels:
          shelf.dev/app: << inputs.name >>

    # Generated secret values, maintained by `shelf app add` in shelf-system/app-<name>.
    - apiVersion: v1
      kind: Secret
      metadata:
        name: shelf-secrets
        namespace: << inputs.name >>
        annotations:
          fluxcd.controlplane.io/copyFrom: shelf-system/app-<< inputs.name >>
      type: Opaque

    # The login of the app's registry connection, for its images and its deploy artifact. An app
    # without one gets registry-anonymous, which holds no login, and reads the registry anonymously.
    - apiVersion: v1
      kind: Secret
      metadata:
        name: shelf-registry
        namespace: << inputs.name >>
        annotations:
          fluxcd.controlplane.io/copyFrom: "shelf-system/<< if inputs.registry >>connection-registry-<< inputs.registry >><< else >>registry-anonymous<< end >>"
      type: kubernetes.io/dockerconfigjson

    # The deploy Kustomization acts as this account, which may only manage ConfigMaps in the
    # app namespace. A deploy artifact with anything else in it fails instead of being applied.
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: shelf-deploy
        namespace: << inputs.name >>
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: shelf-deploy
        namespace: << inputs.name >>
      rules:
        - apiGroups: [""]
          resources: [configmaps]
          verbs: [get, list, watch, create, update, patch, delete]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: shelf-deploy
        namespace: << inputs.name >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: shelf-deploy
      subjects:
        - kind: ServiceAccount
          name: shelf-deploy
          namespace: << inputs.name >>

    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: deploy
        namespace: << inputs.name >>
      spec:
        interval: 1m
        url: << inputs.url >>
        ref:
          tag: << inputs.tag >>
        insecure: << inputs.insecure >>
        secretRef:
          name: shelf-registry
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: deploy
        namespace: << inputs.name >>
      spec:
        interval: 10m
        sourceRef:
          kind: OCIRepository
          name: deploy
        path: ./
        prune: true
        wait: true
        timeout: 2m
        targetNamespace: << inputs.name >>
        serviceAccountName: shelf-deploy
        commonMetadata:
          labels:
            shelf.dev/app: << inputs.name >>
            # helm-controller reconciles the HelmRelease when this ConfigMap changes.
            reconcile.fluxcd.io/watch: Enabled

    # The chart belongs to the platform; its version comes with the platform configuration.
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: shelf-app
        namespace: << inputs.name >>
      spec:
        interval: 1h
        url: ${SHELF_CHART_URL}
        ref:
          tag: ${SHELF_CHART_TAG}
        insecure: ${SHELF_INSECURE_REGISTRY:=false}
        layerSelector:
          mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
          operation: copy
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: << inputs.name >>
        namespace: << inputs.name >>
      spec:
        interval: 10m
        chartRef:
          kind: OCIRepository
          name: shelf-app
        valuesFrom:
          - kind: ConfigMap
            name: << inputs.name >>-values
            valuesKey: app.yaml
        values:
          platform:
            # The app's own domain, or the cluster's.
            domain: "<< if inputs.domain >><< inputs.domain >><< else >>${SHELF_DOMAIN}<< end >>"
            # Quoted: an empty setting would otherwise become null, and the chart would render
            # the host name with a "<nil>" in it.
            hostSuffix: "${SHELF_HOST_SUFFIX:=}"
            imagePullSecret: shelf-registry
        install:
          remediation:
            retries: 3
        upgrade:
          remediation:
            retries: 3
            remediateLastFailure: true

  # An app with a tunnel reaches the internet through cloudflared in its own namespace. The DNS
  # record is not made here: shelf writes it when the app is added, with the token of the app's
  # Cloudflare connection, which never enters the cluster. One rule is enough, because Traefik routes by host name.
  resourcesTemplate: |
    <<- if inputs.tunnel >>
    ---
    apiVersion: v1
    kind: Secret
    metadata:
      name: shelf-tunnel
      namespace: << inputs.name >>
      annotations:
        fluxcd.controlplane.io/copyFrom: shelf-system/tunnel-<< inputs.name >>
    type: Opaque
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: cloudflared
      namespace: << inputs.name >>
    data:
      config.yaml: |
        tunnel: << inputs.tunnel >>
        credentials-file: /etc/cloudflared/credentials/credentials.json
        metrics: 0.0.0.0:2000
        no-autoupdate: true
        ingress:
          - service: http://traefik.traefik.svc.cluster.local:80
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: cloudflared
      namespace: << inputs.name >>
      annotations:
        # Restarts cloudflared when the tunnel credentials or the rule change.
        fluxcd.controlplane.io/checksumFrom: Secret/<< inputs.name >>/shelf-tunnel,ConfigMap/<< inputs.name >>/cloudflared
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: cloudflared
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cloudflared
        spec:
          enableServiceLinks: false
          automountServiceAccountToken: false
          containers:
            - name: cloudflared
              image: cloudflare/cloudflared:2026.9.1
              args: [tunnel, --config, /etc/cloudflared/config/config.yaml, run]
              ports:
                - name: metrics
                  containerPort: 2000
              readinessProbe:
                httpGet:
                  path: /ready
                  port: metrics
                periodSeconds: 10
              livenessProbe:
                httpGet:
                  path: /ready
                  port: metrics
                periodSeconds: 10
                failureThreshold: 6
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: config
                  mountPath: /etc/cloudflared/config
                - name: credentials
                  mountPath: /etc/cloudflared/credentials
          volumes:
            - name: config
              configMap:
                name: cloudflared
            - name: credentials
              secret:
                secretName: shelf-tunnel
    <<- end >>
