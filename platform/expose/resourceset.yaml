# Exposure to the internet: cloudflared holds the tunnel to Cloudflare, external-dns publishes
# the host names of the apps as CNAMEs to that tunnel.
#
# Both only exist once `shelf init expose` created the ResourceSetInputProvider `expose` in
# shelf-system, together with the Secrets it refers to. Without it, this ResourceSet generates
# nothing, so a cluster can run without being exposed.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: expose
  namespace: shelf-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 10m
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      selector:
        matchExpressions:
          - key: shelf.dev/expose
            operator: Exists
  resources:
    # One rule for everything: Traefik does the routing by host name, so the tunnel is set up
    # once and never touched again.
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: cloudflared
        namespace: shelf-system
      data:
        config.yaml: |
          tunnel: << inputs.tunnel >>
          credentials-file: /etc/cloudflared/credentials/credentials.json
          metrics: 0.0.0.0:2000
          no-autoupdate: true
          ingress:
            - service: http://traefik.traefik.svc.cluster.local:80

    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cloudflared
        namespace: shelf-system
        annotations:
          # Restarts cloudflared when the tunnel credentials or the rule change.
          fluxcd.controlplane.io/checksumFrom: Secret/shelf-system/tunnel,ConfigMap/shelf-system/cloudflared
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: cloudflared
        template:
          metadata:
            labels:
              app.kubernetes.io/name: cloudflared
          spec:
            enableServiceLinks: false
            automountServiceAccountToken: false
            containers:
              - name: cloudflared
                image: cloudflare/cloudflared:2026.9.1
                args: [tunnel, --config, /etc/cloudflared/config/config.yaml, run]
                ports:
                  - name: metrics
                    containerPort: 2000
                readinessProbe:
                  httpGet:
                    path: /ready
                    port: metrics
                  periodSeconds: 10
                livenessProbe:
                  httpGet:
                    path: /ready
                    port: metrics
                  periodSeconds: 10
                  failureThreshold: 6
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    memory: 256Mi
                volumeMounts:
                  - name: config
                    mountPath: /etc/cloudflared/config
                  - name: credentials
                    mountPath: /etc/cloudflared/credentials
            volumes:
              - name: config
                configMap:
                  name: cloudflared
              - name: credentials
                secret:
                  secretName: tunnel

    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: external-dns
        namespace: shelf-system
      spec:
        interval: 1h
        url: https://kubernetes-sigs.github.io/external-dns/
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: external-dns
        namespace: shelf-system
      spec:
        interval: 1h
        chart:
          spec:
            chart: external-dns
            version: 1.22.0
            sourceRef:
              kind: HelmRepository
              name: external-dns
        install:
          remediation:
            retries: 3
        upgrade:
          remediation:
            retries: 3
        values:
          provider:
            name: cloudflare
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare
                  key: api-token
          sources: [ingress]
          policy: sync
          registry: txt
          # Every cluster owns only its own records, so clusters can share a zone.
          txtOwnerId: << inputs.owner >>
          domainFilters: [<< inputs.domain >>]
          interval: 1m
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
