# Smoke test for the secret embedding in docs/plan.md: a variable sourced from secretKeyRef must
# expand inside a later env value and inside args, $$ must escape expansion, and the secret
# value must not appear in the pod spec. The secret value is a throwaway test value.
apiVersion: v1
kind: Namespace
metadata:
  name: shelf-smoke-secrets
---
apiVersion: v1
kind: Secret
metadata:
  name: smoke
  namespace: shelf-smoke-secrets
stringData:
  password: smoke-value-7f3a
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-expansion
  namespace: shelf-smoke-secrets
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: busybox:1.37
      command: ["sh", "-c"]
      args:
        - |
          fail=0
          [ "$DATABASE_URL" = "postgres://app:smoke-value-7f3a@db:5432/app" ] \
            || { echo "FAIL env expansion: $DATABASE_URL"; fail=1; }
          [ "$1" = "--password=smoke-value-7f3a" ] \
            || { echo "FAIL args expansion: $1"; fail=1; }
          [ "$LITERAL" = '$$(NOT_EXPANDED)' ] \
            || { echo "FAIL escaping in env: $LITERAL"; fail=1; }
          [ "$fail" -eq 0 ] && echo "ok: env expansion, args expansion, escaping"
          exit "$fail"
        - check
        - --password=$(SHELF_SECRET_PASSWORD)
      env:
        - name: SHELF_SECRET_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smoke
              key: password
        - name: DATABASE_URL
          value: postgres://app:$(SHELF_SECRET_PASSWORD)@db:5432/app
        - name: LITERAL
          value: $$(NOT_EXPANDED)
