apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  cluster:
    networkPolicy: true
    type: kubernetes
  components:
  - source-controller
  - kustomize-controller
  - helm-controller
  - notification-controller
  distribution:
    registry: ghcr.io/fluxcd
    version: 2.9.5
  kustomize:
    patches:
    - patch: |
        - op: add
          path: /spec/wait
          value: true
      target:
        kind: Kustomization
        name: flux-system
  sync:
    interval: 1m
    kind: OCIRepository
    path: ./
    ref: v0.3.0
    url: oci://ghcr.io/tweinmann/shelf/platform
