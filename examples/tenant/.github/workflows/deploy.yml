# Builds everything app.yaml declares with `build`, renders it and pushes the deploy artifact
# ghcr.io/tweinmann/greeter. The packages are named after the repository unless `package` says
# otherwise; this repository keeps the name its packages had before app.yaml lost its `name`.
name: deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  shelf:
    uses: tweinmann/shelf/.github/workflows/build.yml@v0
    with:
      package: greeter
