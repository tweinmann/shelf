# Builds everything app.yaml declares with `build`, renders it and pushes the deploy artifact
# ghcr.io/tweinmann/greeter-deploy. Nothing in here is specific to this app.
name: deploy

# Every branch publishes, so that an app with previews runs each one on its own; deleting a branch
# deletes its artifact, and its preview with it. Pull requests only build.
on:
  push:
    branches: ['**']
  pull_request:
  delete:

# id-token lets the workflow sign the images and the deploy artifact with keyless cosign; the
# cluster runs nothing without that signature.
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  shelf:
    uses: tweinmann/shelf/.github/workflows/build.yml@v0
