# yaml-language-server: $schema=https://raw.githubusercontent.com/tweinmann/shelf/main/schema/app.schema.json
#
# A tenant app: one web component built from ./web by the shelf workflow. Change MESSAGE and
# push to see the platform roll out the new version by itself.
apiVersion: shelf.dev/v1alpha1
name: greeter

components:
  web:
    # The workflow builds this directory, pushes the image and pins it to its digest. The image
    # name is the workflow's business, so it does not appear here.
    build: ./web
    port: 8080
    route: /
    health: { path: /healthz }
    env:
      MESSAGE: Hello from shelf
      TOKEN: ${secrets.token}
    resources: { cpu: 10m, memory: 16Mi }

# Runs after every rollout, against the app or a preview, inside its namespace. The rollout counts
# only when curl exits with 0; on main a failing test brings the previous version back.
tests:
  smoke:
    image: curlimages/curl:8.10.1
    # A new pod's first connection can be refused for a moment, until the network policy knows
    # it; --retry-connrefused waits that out, as against any service that just started.
    args: [-fsS, --retry, "5", --retry-connrefused, --retry-delay, "1", "http://${web.host}:${web.port}/healthz"]
    resources: { cpu: 10m, memory: 16Mi }

secrets:
  token: { generate: true }
