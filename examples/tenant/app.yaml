# yaml-language-server: $schema=https://raw.githubusercontent.com/tweinmann/shelf/main/schema/app.schema.json
#
# A tenant app: one web component built from ./web by the shelf workflow. Change MESSAGE and
# push to see the platform roll out the new version by itself.
apiVersion: shelf.dev/v1alpha1
name: greeter

components:
  web:
    # The workflow builds this directory, pushes the image and pins it to its digest. The image
    # name is the workflow's business, so it does not appear here.
    build: ./web
    port: 8080
    route: /
    health: { path: /healthz }
    env:
      MESSAGE: Hello from shelf
      TOKEN: ${secrets.token}
    resources: { cpu: 10m, memory: 16Mi }

secrets:
  token: { generate: true }
