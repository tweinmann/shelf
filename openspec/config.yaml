schema: spec-driven

context: |
  Language: English
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## The product
  shelf is a self-hosted GitOps platform, written in Go, for running parallel coding-agent
  branches as isolated, verified previews on your own hardware, with a path to production through
  standard artefacts. Tenants build images in their own CI and push a deploy artifact to GHCR;
  shelf watches it and deploys it. One binary is a CLI (`shelf`) and, as `shelf serve`, an admin
  UI with a login. Target users: experienced developers and small teams who run coding agents
  (Claude Code first) in several worktrees at once, not people who never want to see Kubernetes.

  The target, as re-cut on 2026-10-27: every branch gets its own isolated preview, only a verified
  artefact becomes reachable beyond a preview, and the same verified state goes to any Kubernetes
  cloud as a pull request (eject), without depending on shelf. shelf runs on any Linux host with
  k3s, with a one-step install on a Mac (Colima). Today it runs against any kubecontext, developed
  on the dev cluster, with branch previews and the verification chain; the host setup and eject
  are planned. shelf is pre-production: an app's "main" is its stable, verified state, not
  production. Learning and reference project for platform engineering.

  OpenSpec is the only planning source: `openspec/specs/` is what shelf does today,
  `openspec/changes/` what it is about to do (the roadmap is the `phase-<n>-<slug>` changes), and
  `openspec/changes/archive/` how it got here. Everything before OpenSpec, with the reasons of
  every earlier decision, is in `archive/2026-10-20-baseline/` (design.md, phases.md). CLAUDE.md
  holds the working agreements, guardrails, safety rules and conventions in full; read it before
  proposing, it wins over this summary.

  ## Architecture
  - On the host (from Phase 13): a Linux host runs k3s directly; on macOS (Apple Silicon) Colima
    runs a Linux VM with k3s, and the same Linux bootstrap follows. Tier 1: macOS with Colima,
    Ubuntu/Debian on arm64 and amd64. `shelf serve` runs as the logged-in user, never as root (a
    LaunchAgent on macOS); its state is plain files under `~/.shelf` (0700, files 0600): config,
    admin file, secret backups, Cloudflare connections, audit log. No keychain: an unsigned,
    self-updating binary would re-prompt.
  - In the cluster: Flux, installed through the Flux Operator (`FluxInstance`), syncs the platform
    artifact (`platform/`: Traefik as ClusterIP in `traefik`, the ResourceSet `apps` in
    `shelf-system`). Each app is a `ResourceSetInputProvider`; the ResourceSet renders its
    namespace, the deploy artifact source and the HelmRelease of the generic chart `shelf-app`.
    An exposed app has cloudflared in its namespace with one rule to Traefik, which routes by Host.
  - Previews: an app with `--previews` has a second provider `<app>--previews` (type
    OCIArtifactTag) that follows the `branch-*` tags of its deploy artifact; the ResourceSet
    `previews` runs each tag in a namespace `<app>--<slug>` with a quota, limits and secrets the
    chart generates, never exposed. A branch build publishes the tag, deleting the branch deletes
    it, and the platform only reads the registry.
  - Verification chain: the reusable workflow signs every built image and the deploy artifact
    with keyless cosign (identity: shelf's build.yml) and writes a Trivy summary into the
    artifact (`dev.shelf.scan`) before signing it; releases sign chart and platform. Flux
    verifies every OCIRepository against the cluster's signer, and the Sigstore
    policy-controller admits a built image of an app's package only with its signature, in app
    and preview namespaces. Third-party images are pinned by digest in the signed artifact.
    The dev cluster verifies with a dev key; there is no setting that turns verification off.
  - Hardening: app and preview namespaces enforce Pod Security `baseline` (warn and audit
    `restricted`), and the NetworkPolicy `shelf-isolation` lets pods reach their namespace, the
    cluster DNS and the internet only; only Traefik reaches in, and only cloudflared reaches
    Traefik. The operator may give one app LAN ranges (`--allow-lan`), never its previews. Tests
    from `tests:` in app.yaml are Helm test hooks run by helm-controller after every rollout; a
    failing test rolls an app back and leaves a preview on the failing version, and the wait is
    Ready only once they pass. `shelf app report` is the per-branch report for a pull request.
  - `shelf init` is split into idempotent layers: `init host` (Phase 13: provide the environment,
    macOS or Linux), `init cluster` (any kubecontext, no Colima or distribution assumptions) and
    the wrapper.
  - Three separate states per app and preview: build (built, scanned, signed), deployment (which
    digest runs where) and exposure (cluster only, port-forward, tunnel). Exposure is the
    operator's decision, never part of app.yaml, and only a verified app can be exposed: the
    gate in `ops.AddApp` refuses a tunnel to an app whose running artifact is not signed and
    scanned. Apps and previews are reached by
    port-forward through the API server to Traefik (`shelf app open`); LAN access stays rejected.
  - Agents read the platform through `--json` documents and `shelf app status --wait --commit`,
    which only reads: the commit comes from the deploy artifact's revision annotation, never
    from a forge API.
  - Test levels: 1 is `just test` without a cluster (also CI), 2 the k3d cluster `shelf-dev` in
    the devcontainer (`just smoke-*`; in CI when a pull request is ready or labelled `level-2`,
    chosen by changed paths, and in full on main), 3 the mini and real Cloudflare.
    The rules are in the spec `dev-environment`.

  ## Rules for proposals
  - A phase is one change, `phase-<n>-<slug>`. Proposing a draft phase replaces its roadmap text
    with a real proposal, writes its delta specs, design.md and tasks.md, and removes
    `skip_specs: true` from its `.openspec.yaml`. Only a change that changes no behaviour (pure
    verification, tooling, docs) keeps `skip_specs`.
  - Decisions go into the change's design.md, with the alternatives and why they lost. A decision
    that changes a convention, guardrail or safety rule also changes CLAUDE.md, or this context,
    in the same change.
  - Ask the maintainer about open design decisions instead of assuming.
  - The registry is the only interface between build and platform; the cluster never talks to
    Git or forge APIs.
  - Every admin UI action exists as a CLI command; both call the same function in internal/ops.
  - The platform is generic (everything is a component) and apps are isolated from each other,
    enforced by Pod Security and a NetworkPolicy per namespace; LAN access is per app and an
    operator decision.
  - Layering: internal/cluster talks to the API server only (client-go, server-side apply);
    orchestration in internal/ops, flags in internal/cli, routes and templates in internal/server;
    progress through progress.Reporter; test seams are fields of ops.Ops / ops.Env, never
    package variables; tests run in parallel under -race.
  - Secret values never appear in manifests, logs, golden files or rendered pages.
  - Level-1 checks are `just test`; golden files are rewritten with `just golden`. Tasks that
    need the dev cluster, the network or the Mac mini say so, and name the `just smoke-*` recipe
    that checks them.

  ## Not in the MVP
  Scale-to-zero, an own registry, backups, devcontainer integration for tenant apps, a catalog of managed
  services; more than one user or roles, admin access from the internet, TLS on the LAN, a stable
  public HTTP API (`/api/` serves the UI and may change), code signing, notarization, `.pkg`
  installers, metrics history and graphs, log retention and search, editing app.yaml in the UI,
  apps without a tenant repository, Prometheus. LAN access to apps (proxy plus mDNS) was
  considered and rejected in 8d, and LAN access with wildcard DNS and DNS-01 certificates again
  in the re-cut of 2026-10-27; apps and previews are reached by port-forward or a tunnel.

  ## Later (no phase yet)
  Packages of a GitHub organisation in the form choices; a short 504 seen once during a rollout of
  a single-instance app; MongoDB with auth and a replica set (secrets as file mounts); builds via
  `path`, CronJobs, init and migration jobs, `${app.url}`, secret rotation. From the re-cut of
  2026-10-27: identity-protected previews through Cloudflare Access; the setup wizard (formerly
  Phase 11; re-cut or dropped, its roadmap text is in git history); `--existing-cluster` (install
  only shelf's components into an existing cluster, with the eject target preflight); further eject
  targets; a go-live check; optional opinionated providers (e.g. `resources: db: {type:
  postgres}`); seed data for previews.

